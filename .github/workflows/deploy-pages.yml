name: Deploy to GitHub Pages

# Publishes PrivateRedact/dist to https://himanshu-codes290.github.io/PrivateRedact/
# on every push to main. The site is fully static: no secrets, no backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build for Pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PrivateRedact
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: PrivateRedact/package-lock.json

      - name: Install
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build
        run: npm run build
        env:
          # The site lives under /<repo>/ on github.io.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: SPA fallback
        # GitHub Pages has no rewrite rules: serving the app as 404.html makes
        # deep links such as /PrivateRedact/redact load on refresh.
        run: cp dist/index.html dist/404.html

      # One-time setup: Settings -> Pages -> Source: "GitHub Actions". The
      # workflow token cannot create the Pages site itself.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: PrivateRedact/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
