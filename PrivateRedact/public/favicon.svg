<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Document Page Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Redaction Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Shield Container (Privacy) -->
  <path d="M256 32 L416 96 V224 C416 336 346 432 256 480 C166 432 96 336 96 224 V96 Z" 
        fill="url(#shieldGrad)" 
        stroke="#38bdf8" 
        stroke-width="12" 
        stroke-linejoin="round"/>

  <!-- Document Body -->
  <g filter="url(#glow)">
    <!-- Document Base with Folded Corner -->
    <path d="M176 128 H304 L352 176 V368 H176 Z" 
          fill="url(#docGrad)"/>
    
    <!-- Folded Corner Detail -->
    <path d="M304 128 V176 H352 Z" 
          fill="#94a3b8"/>

    <!-- Document Text Skeleton Lines -->
    <rect x="208" y="160" width="80" height="10" rx="5" fill="#64748b"/>
    <rect x="208" y="190" width="112" height="10" rx="5" fill="#94a3b8"/>
    <rect x="208" y="280" width="112" height="10" rx="5" fill="#94a3b8"/>
    <rect x="208" y="310" width="70" height="10" rx="5" fill="#94a3b8"/>

    <!-- Prominent Redaction Blackout Bar (Action Feature) -->
    <rect x="192" y="222" width="144" height="36" rx="6" fill="#000000"/>
    
    <!-- Lock Accent Icon on top of Redaction Bar -->
    <path d="M256 234 C250.5 234 246 238.5 246 244 V247 H243 V257 H269 V247 H266 V244 C266 238.5 261.5 234 256 234 Z M256 237 C259.9 237 263 240.1 263 244 V247 H249 V244 C249 240.1 252.1 237 256 237 Z" 
          fill="#38bdf8"/>
  </g>
</svg>
